<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{authors.list.title}">Author list</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1 th:text="#{authors.list.title}">Author list</h1>
<table>
    <thead>
    <tr>
        <th th:text="#{authors.list.id}">Id</th>
        <th th:text="#{authors.list.fullName}">Full name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="author : ${authors}">
        <td th:text="${author.id}"></td>
        <td th:text="${author.fullName}"></td>
    </tr>
    </tbody>
</table>

<a href="/books" th:text="#{books.view.back}">Back to book list</a>
</body>

</html>
