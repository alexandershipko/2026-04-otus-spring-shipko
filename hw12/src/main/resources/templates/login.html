<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>
<h1 th:text="#{login.title}">Login</h1>

<p th:if="${param.error}" th:text="#{login.error}">Invalid username or password</p>
<p th:if="${param.logout}" th:text="#{login.logout}">You have been logged out</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username" th:text="#{login.username}">Username:</label>
        <input type="text" id="username" name="username"/>
    </div>
    <div>
        <label for="password" th:text="#{login.password}">Password:</label>
        <input type="password" id="password" name="password"/>
    </div>
    <button type="submit" th:text="#{login.submit}">Sign in</button>
</form>

<p>
    <a th:href="@{/login(lang=ru)}">RU</a>
    <a th:href="@{/login(lang=en_US)}">EN</a>
</p>
</body>

</html>
