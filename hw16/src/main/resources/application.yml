spring:
  messages:
    fallback-to-system-locale: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

    show-sql: true

  datasource:
    url: jdbc:h2:mem:maindb;MODE=LEGACY

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml