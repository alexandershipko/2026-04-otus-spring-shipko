<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{genres.list.title}">Genre list</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1 th:text="#{genres.list.title}">Genre list</h1>
<p class="error" id="error-message"></p>
<table>
    <thead>
    <tr>
        <th th:text="#{genres.list.id}">Id</th>
        <th th:text="#{genres.list.name}">Name</th>
    </tr>
    </thead>
    <tbody id="genres-body"></tbody>
</table>

<a href="/books" th:text="#{books.view.back}">Back to book list</a>
<script th:inline="javascript">
    window.i18n = {
        loadError: /*[[#{common.loadError}]]*/ 'Failed to load data'
    };
</script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/genres-list.js}"></script>
</body>

</html>
