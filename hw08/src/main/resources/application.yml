spring:
  shell:
    interactive:
      enabled: true
    command:
      version:
        enabled: false

  data:
    mongodb:
      port: 0 # when flapdoodle using
      database: library

mongock:
  #runner-type: "ApplicationRunner" # default
  runner-type: "InitializingBean"
  migration-scan-package: ru.otus.hw.migrations
  transactional: false
  mongo-db:
    write-concern:
      journal: false
    read-concern: local

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14