<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="#{books.list.title}">Book list</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1 th:text="#{books.list.title}">Book list</h1>
<a sec:authorize="hasRole('ADMIN')" href="/books/new" th:text="#{books.list.add}">Add book</a>
<table>
    <thead>
    <tr>
        <th th:text="#{books.list.id}">Id</th>
        <th th:text="#{books.list.titleColumn}">Title</th>
        <th th:text="#{books.list.author}">Author</th>
        <th th:text="#{books.list.genres}">Genres</th>
        <th th:text="#{books.list.actions}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a></td>
        <td th:text="${book.author.fullName}"></td>
        <td>
            <span th:each="genre, iter : ${book.genres}">
                <span th:text="${genre.name}"></span><span th:if="${!iter.last}">, </span>
            </span>
        </td>
        <td sec:authorize="hasRole('ADMIN')">
            <a class="btn" th:href="@{/books/{id}/edit(id=${book.id})}" th:text="#{books.list.edit}">Edit</a>
            <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" style="display:inline">
                <button type="submit" class="btn"
                        th:text="#{books.list.delete}"
                        th:onclick="|return confirm('#{books.list.deleteConfirm}')|">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>

</html>
