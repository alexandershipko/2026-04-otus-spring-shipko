spring:
  messages:
    fallback-to-system-locale: false

  output:
    ansi:
      enabled: always

  r2dbc:
    url: r2dbc:h2:mem:///testdb
    pool:
      enabled: true
      min-idle: 1

  liquibase:
    change-log: classpath:db/changelog/db.changelog-test.yaml
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1